site_name: ziviSpaceEcho
site_description: RE-201 inspired tape echo + spring reverb for REAPER / JSFX.
site_author: Victor Valentim
site_url: https://vicvalentim.github.io/ziviSpaceEchoJS/

repo_name: vicvalentim/ziviSpaceEchoJS
repo_url: https://github.com/vicvalentim/ziviSpaceEchoJS
edit_uri: edit/main/docs/

copyright: >
  Independent inspired-by project. Product names and trademarks belong to their respective owners.

theme:
  name: material
  language: en
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vicvalentim/ziviSpaceEchoJS
      name: GitHub repository
  generator: false

nav:
  - Home: index.md
  - Download: download.md
  - Installation: installation.md
  - Manual:
      - Overview: manual.md
      - Parameter Reference: parameters.md
      - Sound Design Guide: sound-design.md
  - Gallery: gallery.md
  - Demos: demos.md
  - Technical:
      - Developer Notes: developer-notes.md
      - Changelog: changelog.md
      - License: license.md
