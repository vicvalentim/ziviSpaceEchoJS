site_name: ziviSpaceEcho
site_description: RE-201 inspired tape echo + spring reverb for REAPER / JSFX.
site_author: Victor Valentim
site_url: https://vicvalentim.github.io/ziviSpaceEchoJS/

repo_name: vicvalentim/ziviSpaceEchoJS
repo_url: https://github.com/vicvalentim/ziviSpaceEchoJS
edit_uri: edit/main/docs/

copyright: >
  Independent inspired-by project. Product names and trademarks belong to their respective owners.

theme:
  name: material
  language: en
  logo: assets/images/zivi-logo.svg
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
    annotation: material/plus-circle
  palette:
    - scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - announce.dismiss

plugins:
  - search:
      lang:
        - en
        - pt
        - es
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav_translations:
            Home: Home
            Concept: Concept
            Download: Download
            Installation: Installation
            Manual: Manual
            Overview: Overview
            Parameter Reference: Parameter Reference
            Sound Design Guide: Sound Design Guide
            Gallery: Gallery
            Demos: Demos
            Technical: Technical
            Developer Notes: Developer Notes
            Use of Generative AI: Use of Generative AI
            Changelog: Changelog
            License: License
        - locale: pt-BR
          name: Português (BR)
          build: true
          site_name: ziviSpaceEcho
          nav_translations:
            Home: Início
            Concept: Conceito
            Download: Download
            Installation: Instalação
            Manual: Manual
            Overview: Visão geral
            Parameter Reference: Referência de parâmetros
            Sound Design Guide: Guia de desenho sonoro
            Gallery: Galeria
            Demos: Demos
            Technical: Técnico
            Developer Notes: Notas de desenvolvimento
            Use of Generative AI: Uso de IA generativa
            Changelog: Registro de mudanças
            License: Licença
        - locale: es
          name: Español
          build: true
          site_name: ziviSpaceEcho
          nav_translations:
            Home: Inicio
            Concept: Concepto
            Download: Descarga
            Installation: Instalación
            Manual: Manual
            Overview: Panorama general
            Parameter Reference: Referencia de parámetros
            Sound Design Guide: Guía de diseño sonoro
            Gallery: Galería
            Demos: Demos
            Technical: Técnico
            Developer Notes: Notas de desarrollo
            Use of Generative AI: Uso de IA generativa
            Changelog: Registro de cambios
            License: Licencia

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vicvalentim/ziviSpaceEchoJS
      name: GitHub repository
    - icon: material/archive-arrow-down
      link: https://doi.org/10.5281/zenodo.21195881
      name: Zenodo DOI
  generator: false

nav:
  - Home: index.md
  - Concept: concept.md
  - Download: download.md
  - Installation: installation.md
  - Manual:
      - Overview: manual.md
      - Parameter Reference: parameters.md
      - Sound Design Guide: sound-design.md
  - Gallery: gallery.md
  - Demos: demos.md
  - Technical:
      - Developer Notes: developer-notes.md
      - Use of Generative AI: ai-usage.md
      - Changelog: changelog.md
      - License: license.md
